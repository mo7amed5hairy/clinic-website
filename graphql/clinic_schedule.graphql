type ClinicSchedule {
    id: ID!
    date_from: String!
    date_to: String!
    time_from: String!
    time_to: String!
    is_active: Boolean!
}

extend type Query {
    clinicSchedules: [ClinicSchedule!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicScheduleResolver@list"
        )

    clinicSchedule(id: ID!): ClinicSchedule
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicScheduleResolver@show"
        )
}

extend type Mutation {
    createClinicSchedule(
        date_from: String!
        date_to: String!
        time_from: String!
        time_to: String!
        is_active: Boolean
    ): ClinicSchedule
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicScheduleResolver@create"
        )

    updateClinicSchedule(
        id: ID!
        date_from: String
        date_to: String
        time_from: String
        time_to: String
        is_active: Boolean
    ): ClinicSchedule
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicScheduleResolver@update"
        )

    deleteClinicSchedule(id: ID!): Boolean
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicScheduleResolver@destroy"
        )
}


