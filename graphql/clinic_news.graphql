type ClinicNews {
    id: ID!
    title: JSON!
    description: JSON
    content: JSON
    image: String
    is_active: Boolean!
}

input ClinicNewsInput {
    title: LocalizedStringInput!
    description: LocalizedStringInput
    content: LocalizedStringInput
    is_active: Boolean
    image: Upload
}

extend type Query {
    # جلب كل الأخبار
    clinicNews: [ClinicNews!]!
        @field(
            resolver: "App\\Modules\\ClinicNews\\GraphQL\\ClinicNewsResolver@list"
        )

    # جلب خبر محدد
    clinicNew(id: ID!): ClinicNews
        @field(
            resolver: "App\\Modules\\ClinicNews\\GraphQL\\ClinicNewsResolver@show"
        )
}

extend type Mutation {
    # إنشاء خبر
    createClinicNews(input: ClinicNewsInput!): ClinicNews
        @field(
            resolver: "App\\Modules\\ClinicNews\\GraphQL\\ClinicNewsResolver@create"
        )

    # تحديث خبر
    updateClinicNews(id: ID!, input: ClinicNewsInput!): ClinicNews
        @field(
            resolver: "App\\Modules\\ClinicNews\\GraphQL\\ClinicNewsResolver@update"
        )

    # حذف خبر
    deleteClinicNews(id: ID!): Boolean
        @field(
            resolver: "App\\Modules\\ClinicNews\\GraphQL\\ClinicNewsResolver@destroy"
        )
}
