type Department {
    id: ID!
    doctor_id: ID!
    tenant_id: String!
    name: String!
}

extend type Query {
    departments: [Department!]!
        @field(resolver: "App\\GraphQL\\Resolvers\\DepartmentResolver@list")

    department(id: ID!): Department
        @field(resolver: "App\\GraphQL\\Resolvers\\DepartmentResolver@show")
}

extend type Mutation {
    createDepartment(doctor_id: ID!, name: String!): Department
        @field(resolver: "App\\GraphQL\\Resolvers\\DepartmentResolver@create")

    updateDepartment(id: ID!, doctor_id: ID, name: String): Department
        @field(resolver: "App\\GraphQL\\Resolvers\\DepartmentResolver@update")

    deleteDepartment(id: ID!): Boolean
        @field(resolver: "App\\GraphQL\\Resolvers\\DepartmentResolver@destroy")
}
