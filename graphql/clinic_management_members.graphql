type ClinicManagementMember {
    id: ID!
    name: String!
    position: String
    bio: String
    photo: String
    is_active: Boolean!
}

extend type Query {
    # جلب كل الأعضاء
    clinicManagementMembers: [ClinicManagementMember!]!
        @field(
            resolver: "App\\Modules\\ClinicManagementMember\\GraphQL\\ClinicManagementMemberResolver@list"
        )
        @guard(with: ["sanctum"])

    # جلب عضو محدد
    clinicManagementMember(id: ID!): ClinicManagementMember
        @field(
            resolver: "App\\Modules\\ClinicManagementMember\\GraphQL\\ClinicManagementMemberResolver@show"
        )
        @guard(with: ["sanctum"])
}

extend type Mutation {
    # إنشاء عضو
    createClinicManagementMember(
        name: String!
        position: String
        bio: String
        is_active: Boolean
        photo: Upload
    ): ClinicManagementMember
        @field(
            resolver: "App\\Modules\\ClinicManagementMember\\GraphQL\\ClinicManagementMemberResolver@create"
        )
        @guard(with: ["sanctum"])

    # تحديث عضو
    updateClinicManagementMember(
        id: ID!
        name: String
        position: String
        bio: String
        is_active: Boolean
        photo: Upload
    ): ClinicManagementMember
        @field(
            resolver: "App\\Modules\\ClinicManagementMember\\GraphQL\\ClinicManagementMemberResolver@update"
        )
        @guard(with: ["sanctum"])

    # حذف عضو
    deleteClinicManagementMember(id: ID!): Boolean
        @field(
            resolver: "App\\Modules\\ClinicManagementMember\\GraphQL\\ClinicManagementMemberResolver@destroy"
        )
        @guard(with: ["sanctum"])
}
