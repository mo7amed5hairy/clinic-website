type Doctor {
    id: ID!
    doctor_data: JSON!
    is_active: Boolean!
}

type Query {
    doctors: [Doctor!]!
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@list")

    doctor(id: ID!): Doctor
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@show")
}

type Mutation {
    createDoctor(doctor_data: JSON!, is_active: Boolean): Doctor
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@create")
}
