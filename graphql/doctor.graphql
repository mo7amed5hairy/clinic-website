type Doctor {
    id: ID!
    doctor_data: JSON!
    is_active: Boolean!
}

extend type Query {
    doctors: [Doctor!]!
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@list")

    doctor(id: ID!): Doctor
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@show")
}

extend type Mutation {
    createDoctor(doctor_data: JSON!, is_active: Boolean, image: Upload): Doctor
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@create")

    updateDoctor(
        id: ID!
        doctor_data: JSON
        is_active: Boolean
        image: Upload
    ): Doctor
        @field(resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@update")

    deleteDoctor(id: ID!): Boolean
        @field(
            resolver: "App\\Modules\\Doctor\\GraphQL\\DoctorResolver@destroy"
        )
}
