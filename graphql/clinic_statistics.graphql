type ClinicStatistic {
    id: ID!
    statistics_name: String!
    statistic_value: String!
    is_active: Boolean!
}

extend type Query {
    # جلب كل الإحصائيات
    clinicStatistics: [ClinicStatistic!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicStatisticResolver@list"
        )

    # جلب إحصائية محددة
    clinicStatistic(id: ID!): ClinicStatistic
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicStatisticResolver@show"
        )
}

extend type Mutation {
    # إنشاء إحصائية
    createClinicStatistic(
        statistics_name: String!
        statistic_value: String!
        is_active: Boolean
    ): ClinicStatistic
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicStatisticResolver@create"
        )

    # تحديث إحصائية
    updateClinicStatistic(
        id: ID!
        statistics_name: String
        statistic_value: String
        is_active: Boolean
    ): ClinicStatistic
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicStatisticResolver@update"
        )

    # حذف إحصائية
    deleteClinicStatistic(id: ID!): Boolean
        @field(
            resolver: "App\\GraphQL\\Resolvers\\ClinicStatisticResolver@destroy"
        )
}


